<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Master</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #09090b;
      --bg2:       #111113;
      --bg3:       #18181b;
      --border:    #27272a;
      --border2:   #3f3f46;
      --text:      #fafafa;
      --muted:     #71717a;
      --cyan:      #22d3ee;
      --cyan-dim:  rgba(34,211,238,0.12);
      --cyan-glow: rgba(34,211,238,0.25);
      --green:     #4ade80;
      --green-dim: rgba(74,222,128,0.12);
      --red:       #f87171;
      --red-dim:   rgba(248,113,113,0.12);
      --amber:     #fbbf24;
      --amber-dim: rgba(251,191,36,0.12);
      --sidebar-w: 240px;
      --radius:    8px;
    }

    html, body, #root {
      height: 100%;
      width: 100%
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── Typography ── */
    .font-display { font-family: 'Syne', sans-serif; }

    /* ── Login ── */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 50% at 50% -20%, rgba(34,211,238,0.08), transparent),
        radial-gradient(ellipse 40% 40% at 80% 80%, rgba(74,222,128,0.04), transparent);
    }

    .login-card {
      width: 380px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 0 0 1px rgba(34,211,238,0.06), 0 25px 50px rgba(0,0,0,0.5);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 36px; height: 36px;
      background: var(--cyan-dim);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan);
      font-size: 16px;
    }

    .login-logo-text {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-title {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-sub {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 28px;
    }

    /* ── Form elements ── */
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      appearance: none;
    }

    .field input:focus, .field select:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .field input::placeholder { color: var(--border2); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
    }
    .btn-primary:hover:not(:disabled) { background: #67e8f9; box-shadow: 0 0 20px var(--cyan-glow); }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-outline:hover:not(:disabled) { border-color: var(--border2); background: var(--bg3); }

    .btn-danger {
      background: var(--red-dim);
      color: var(--red);
      border-color: rgba(248,113,113,0.3);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(248,113,113,0.2); }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: transparent;
    }
    .btn-ghost:hover:not(:disabled) { color: var(--text); background: var(--bg3); }

    .btn-sm { padding: 5px 10px; font-size: 11px; }
    .btn-full { width: 100%; }

    /* ── App shell ── */
    .app-shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 30px; height: 30px;
      background: var(--cyan-dim);
      border: 1px solid rgba(34,211,238,0.35);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan);
      font-size: 13px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 12px 8px;
      overflow-y: auto;
    }

    .nav-section {
      margin-bottom: 20px;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.12s;
      font-size: 12px;
      font-weight: 400;
      border: 1px solid transparent;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      color: var(--text);
      background: var(--bg3);
    }

    .nav-item.active {
      color: var(--cyan);
      background: var(--cyan-dim);
      border-color: rgba(34,211,238,0.2);
    }

    .nav-item-icon { font-size: 14px; flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
    }

    .user-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--cyan-dim);
      border: 1px solid rgba(34,211,238,0.3);
      display: flex; align-items: center; justify-content: center;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }

    .user-name {
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .user-role {
      font-size: 10px;
      color: var(--muted);
    }

    /* ── Main content ── */
    .main {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }

    .page-title {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }

    .page-subtitle {
      font-size: 11px;
      color: var(--muted);
    }

    .content {
      padding: 24px;
      flex: 1;
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge-admin { background: rgba(167,139,250,0.15); color: #a78bfa; border: 1px solid rgba(167,139,250,0.3); }
    .badge-viewer { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(251,191,36,0.3); }
    .badge-active { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.3); }
    .badge-inactive { background: var(--red-dim); color: var(--red); border: 1px solid rgba(248,113,113,0.3); }

    /* ── Stat cards ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .stat-card:hover { border-color: var(--border2); }

    .stat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-color, transparent) 0%, transparent 60%);
      opacity: 0.04;
      pointer-events: none;
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .stat-value {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-sub { font-size: 11px; color: var(--muted); }
    .stat-icon {
      position: absolute;
      top: 16px; right: 16px;
      font-size: 22px;
      opacity: 0.2;
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .table-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-title {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
    }

    .table-actions { display: flex; align-items: center; gap: 8px; }

    .search-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 12px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      outline: none;
      width: 200px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .search-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .search-input::placeholder { color: var(--border2); }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      padding: 10px 16px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg3);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.01); }

    .td-username { font-weight: 500; color: var(--text); }
    .td-email    { color: var(--muted); }

    .row-actions { display: flex; align-items: center; gap: 4px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      animation: modal-in 0.15s ease;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
    }

    .modal-body { padding: 20px 24px; }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Toast ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toast-in 0.2s ease;
      max-width: 320px;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .toast-success { background: #052e16; border: 1px solid rgba(74,222,128,0.3); color: var(--green); }
    .toast-error   { background: #2d0909; border: 1px solid rgba(248,113,113,0.3); color: var(--red); }
    .toast-info    { background: #0e2233; border: 1px solid rgba(34,211,238,0.3); color: var(--cyan); }

    /* ── Alert ── */
    .alert {
      padding: 10px 14px;
      border-radius: 7px;
      font-size: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .alert-error { background: var(--red-dim); border: 1px solid rgba(248,113,113,0.25); color: var(--red); }
    .alert-info  { background: var(--cyan-dim); border: 1px solid rgba(34,211,238,0.25); color: var(--cyan); }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Spinner ── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.3; }
    .empty-text { font-size: 13px; }

    /* ── Role pills ── */
    .role-select-wrap {
      display: flex;
      gap: 8px;
    }

    .role-pill {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg3);
      cursor: pointer;
      text-align: center;
      font-size: 11px;
      transition: all 0.12s;
      color: var(--muted);
    }
    .role-pill:hover { border-color: var(--border2); color: var(--text); }
    .role-pill.selected-admin { border-color: rgba(167,139,250,0.5); background: rgba(167,139,250,0.08); color: #a78bfa; }
    .role-pill.selected-viewer { border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.08); color: var(--amber); }

    /* ── Access denied banner ── */
    .access-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 300px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    .access-denied .icon { font-size: 48px; opacity: 0.3; }
    .access-denied h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text); }

    /* ── Info rows (profile) ── */
    .info-row {
      display: flex;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-key { width: 120px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
    .info-val { font-size: 13px; }

    .section-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .section-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
    }
    .section-card-body { padding: 4px 20px 8px; }

    /* ── Token info ── */
    .token-box {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.8;
    }

    /* ── Confirm dialog ── */
    .confirm-msg { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .confirm-target { color: var(--text); font-weight: 500; }

    /* Loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 300;
      flex-direction: column;
      gap: 16px;
    }
    .loading-logo {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .loading-sub { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

// ─── Config ───────────────────────────────────────────────────────────────────
const API = 'http://localhost:5000/api';

// ─── Auth Context ────────────────────────────────────────────────────────────
const AuthCtx = createContext(null);

function useAuth() { return useContext(AuthCtx); }

// ─── Toast Context ───────────────────────────────────────────────────────────
const ToastCtx = createContext(null);

function useToast() { return useContext(ToastCtx); }

// ─── API helpers ─────────────────────────────────────────────────────────────
let _accessToken = null;
let _refreshToken = localStorage.getItem('refresh_token');
let _refreshing = null;

function setTokens(access, refresh) {
  _accessToken = access;
  if (refresh) {
    _refreshToken = refresh;
    localStorage.setItem('refresh_token', refresh);
  }
}

function clearTokens() {
  _accessToken = null;
  _refreshToken = null;
  localStorage.removeItem('refresh_token');
}

async function apiCall(method, path, data = null, skipAuth = false) {
  const headers = { 'Content-Type': 'application/json' };
  if (!skipAuth && _accessToken) headers['Authorization'] = `Bearer ${_accessToken}`;

  const cfg = { method, url: `${API}${path}`, headers };
  if (data) cfg.data = data;

  try {
    const res = await axios(cfg);
    return { data: res.data, ok: true };
  } catch (err) {
    const status = err.response?.status;
    const code   = err.response?.data?.code;

    // Try refresh on expired access token
    if (status === 401 && code === 'TOKEN_EXPIRED' && !skipAuth && _refreshToken) {
      if (!_refreshing) {
        _refreshing = (async () => {
          try {
            const r = await axios.post(`${API}/auth/refresh`, {}, {
              headers: { Authorization: `Bearer ${_refreshToken}` }
            });
            setTokens(r.data.access_token, null);
          } catch {
            clearTokens();
            window.location.reload();
          } finally { _refreshing = null; }
        })();
      }
      await _refreshing;
      return apiCall(method, path, data, skipAuth);
    }

    return {
      ok: false,
      error: err.response?.data?.error || 'Request failed',
      status,
    };
  }
}

// ─── Toast ───────────────────────────────────────────────────────────────────
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const idRef = useRef(0);

  const addToast = useCallback((msg, type = 'info') => {
    const id = ++idRef.current;
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  }, []);

  const icons = { success: '✓', error: '✕', info: 'ℹ' };

  return (
    <ToastCtx.Provider value={addToast}>
      {children}
      <div className="toast-container">
        {toasts.map(t => (
          <div key={t.id} className={`toast toast-${t.type}`}>
            <span>{icons[t.type]}</span>
            {t.msg}
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

// ─── Auth Provider ───────────────────────────────────────────────────────────
function AuthProvider({ children }) {
  const [user, setUser]       = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    // Try silent restore from refresh token
    if (_refreshToken) {
      (async () => {
        const r = await apiCall('POST', '/auth/refresh', {}, false);
        if (r.ok) {
          setTokens(r.data.access_token, null);
          const me = await apiCall('GET', '/auth/me');
          if (me.ok) setUser(me.data);
        } else {
          clearTokens();
        }
        setLoading(false);
      })();
    } else {
      setLoading(false);
    }
  }, []);

  const login = async (username, password) => {
    const r = await apiCall('POST', '/auth/login', { username, password }, true);
    if (r.ok) {
      setTokens(r.data.access_token, r.data.refresh_token);
      setUser(r.data.user);
      return { ok: true };
    }
    return { ok: false, error: r.error };
  };

  const logout = async () => {
    await apiCall('DELETE', '/auth/logout');
    clearTokens();
    setUser(null);
  };

  const isAdmin = user?.role === 'Admin';

  return (
    <AuthCtx.Provider value={{ user, loading, login, logout, isAdmin }}>
      {children}
    </AuthCtx.Provider>
  );
}

// ─── User Form Modal ──────────────────────────────────────────────────────────
function UserModal({ mode, user, onClose, onSave }) {
  const toast = useToast();
  const [form, setForm]     = useState({
    username:  user?.username  || '',
    email:     user?.email     || '',
    password:  '',
    role:      user?.role      || 'Viewer',
    is_active: user?.is_active ?? true,
  });
  const [error, setError]   = useState('');
  const [loading, setLoading] = useState(false);

  const isEdit = mode === 'edit';

  const handleSubmit = async () => {
    setError('');
    setLoading(true);

    let r;
    if (isEdit) {
      r = await apiCall('PUT', `/users/${user.id}`, form);
    } else {
      r = await apiCall('POST', '/users', form);
    }

    setLoading(false);
    if (r.ok) {
      toast(isEdit ? 'User updated successfully' : 'User created successfully', 'success');
      onSave(r.data);
    } else {
      setError(r.error);
    }
  };

  const f = (k, v) => setForm(prev => ({ ...prev, [k]: v }));

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title font-display">{isEdit ? 'Edit User' : 'Create User'}</span>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          {error && <div className="alert alert-error">⚠ {error}</div>}

          {!isEdit && (
            <div className="field">
              <label>Username</label>
              <input
                type="text"
                placeholder="john_doe"
                value={form.username}
                onChange={e => f('username', e.target.value)}
                autoFocus
              />
            </div>
          )}

          <div className="field">
            <label>Email</label>
            <input
              type="email"
              placeholder="user@example.com"
              value={form.email}
              onChange={e => f('email', e.target.value)}
            />
          </div>

          <div className="field">
            <label>{isEdit ? 'New Password (leave blank to keep)' : 'Password'}</label>
            <input
              type="password"
              placeholder="••••••••"
              value={form.password}
              onChange={e => f('password', e.target.value)}
            />
          </div>

          <div className="field">
            <label>Role</label>
            <div className="role-select-wrap">
              {['Admin', 'Viewer'].map(r => (
                <div
                  key={r}
                  className={`role-pill ${form.role === r ? `selected-${r.toLowerCase()}` : ''}`}
                  onClick={() => f('role', r)}
                >
                  {r === 'Admin' ? '⬡ Admin' : '◎ Viewer'}
                </div>
              ))}
            </div>
          </div>

          {isEdit && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '10px 0' }}>
              <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 12 }}>
                <input
                  type="checkbox"
                  checked={form.is_active}
                  onChange={e => f('is_active', e.target.checked)}
                  style={{ accentColor: 'var(--cyan)' }}
                />
                Account active
              </label>
            </div>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline btn-sm" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-primary btn-sm"
            onClick={handleSubmit}
            disabled={loading || (!isEdit && (!form.username || !form.password || !form.email))}
          >
            {loading ? <><span className="spinner" /> Saving…</> : (isEdit ? 'Save Changes' : 'Create User')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Confirm Modal ────────────────────────────────────────────────────────────
function ConfirmModal({ title, message, target, onConfirm, onClose }) {
  const [loading, setLoading] = useState(false);
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title font-display">{title}</span>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <p className="confirm-msg">
            {message} <span className="confirm-target">{target}</span>?
            <br />
            <span style={{ fontSize: 11, marginTop: 8, display: 'block' }}>This action cannot be undone.</span>
          </p>
        </div>
        <div className="modal-footer">
          <button className="btn btn-outline btn-sm" onClick={onClose}>Cancel</button>
          <button
            className="btn btn-danger btn-sm"
            onClick={async () => { setLoading(true); await onConfirm(); setLoading(false); }}
            disabled={loading}
          >
            {loading ? <span className="spinner" /> : 'Delete'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── Users View ───────────────────────────────────────────────────────────────
function UsersView() {
  const { isAdmin, user: currentUser } = useAuth();
  const toast = useToast();
  const [users, setUsers]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [modal, setModal]     = useState(null); // null | { mode, user }
  const [confirm, setConfirm] = useState(null);

  const loadUsers = async () => {
    const r = await apiCall('GET', '/users');
    if (r.ok) setUsers(r.data);
    setLoading(false);
  };

  useEffect(() => { loadUsers(); }, []);

  const filtered = users.filter(u =>
    u.username.toLowerCase().includes(search.toLowerCase()) ||
    u.email.toLowerCase().includes(search.toLowerCase()) ||
    u.role.toLowerCase().includes(search.toLowerCase())
  );

  const handleDelete = async (u) => {
    const r = await apiCall('DELETE', `/users/${u.id}`);
    if (r.ok) {
      toast(`User "${u.username}" deleted`, 'success');
      setUsers(us => us.filter(x => x.id !== u.id));
      setConfirm(null);
    } else {
      toast(r.error, 'error');
      setConfirm(null);
    }
  };

  const handleSave = (updated) => {
    setUsers(us => {
      const idx = us.findIndex(x => x.id === updated.id);
      if (idx >= 0) { const n = [...us]; n[idx] = updated; return n; }
      return [updated, ...us];
    });
    setModal(null);
  };

  const formatDate = (iso) => new Date(iso).toLocaleDateString('en-US', {
    month: 'short', day: 'numeric', year: 'numeric'
  });

  return (
    <div className="content">
      <div style={{ marginBottom: 20 }}>
        <h2 style={{ fontFamily: 'Syne', fontSize: 20, fontWeight: 800, marginBottom: 4 }}>Users</h2>
        <p style={{ fontSize: 12, color: 'var(--muted)' }}>
          {isAdmin ? 'Manage user accounts, roles, and access.' : 'View all registered users (read-only).'}
        </p>
      </div>

      <div className="table-wrap">
        <div className="table-header">
          <span className="table-title font-display">
            All Users
            <span style={{ marginLeft: 8, fontSize: 11, fontWeight: 400, color: 'var(--muted)', fontFamily: 'JetBrains Mono' }}>
              ({filtered.length})
            </span>
          </span>
          <div className="table-actions">
            <input
              className="search-input"
              placeholder="Search users…"
              value={search}
              onChange={e => setSearch(e.target.value)}
            />
            {isAdmin && (
              <button className="btn btn-primary btn-sm" onClick={() => setModal({ mode: 'create', user: null })}>
                + New User
              </button>
            )}
          </div>
        </div>

        {loading ? (
          <div style={{ padding: 32, display: 'flex', gap: 10, alignItems: 'center', color: 'var(--muted)', fontSize: 12 }}>
            <span className="spinner" /> Loading…
          </div>
        ) : filtered.length === 0 ? (
          <div className="empty-state">
            <div className="empty-icon">◎</div>
            <div className="empty-text">{search ? 'No users match your search.' : 'No users found.'}</div>
          </div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table>
              <thead>
                <tr>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Created</th>
                  {isAdmin && <th>Actions</th>}
                </tr>
              </thead>
              <tbody>
                {filtered.map(u => (
                  <tr key={u.id}>
                    <td>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <div style={{
                          width: 24, height: 24, borderRadius: '50%',
                          background: u.role === 'Admin' ? 'rgba(167,139,250,0.15)' : 'var(--amber-dim)',
                          border: `1px solid ${u.role === 'Admin' ? 'rgba(167,139,250,0.3)' : 'rgba(251,191,36,0.3)'}`,
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          fontSize: 10, color: u.role === 'Admin' ? '#a78bfa' : 'var(--amber)',
                          flexShrink: 0,
                        }}>
                          {u.username[0].toUpperCase()}
                        </div>
                        <span className="td-username">
                          {u.username}
                          {u.id === currentUser?.id && (
                            <span style={{ marginLeft: 6, fontSize: 10, color: 'var(--cyan)' }}>(you)</span>
                          )}
                        </span>
                      </div>
                    </td>
                    <td className="td-email">{u.email}</td>
                    <td>
                      <span className={`badge badge-${u.role.toLowerCase()}`}>{u.role}</span>
                    </td>
                    <td>
                      <span className={`badge badge-${u.is_active ? 'active' : 'inactive'}`}>
                        {u.is_active ? 'Active' : 'Inactive'}
                      </span>
                    </td>
                    <td style={{ color: 'var(--muted)' }}>{formatDate(u.created_at)}</td>
                    {isAdmin && (
                      <td>
                        <div className="row-actions">
                          <button
                            className="btn btn-ghost btn-sm"
                            onClick={() => setModal({ mode: 'edit', user: u })}
                            title="Edit"
                          >
                            ✎ Edit
                          </button>
                          <button
                            className="btn btn-danger btn-sm"
                            onClick={() => setConfirm(u)}
                            disabled={u.id === currentUser?.id}
                            title={u.id === currentUser?.id ? "Can't delete yourself" : 'Delete'}
                          >
                            ✕
                          </button>
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {modal && (
        <UserModal
          mode={modal.mode}
          user={modal.user}
          onClose={() => setModal(null)}
          onSave={handleSave}
        />
      )}

      {confirm && (
        <ConfirmModal
          title="Delete User"
          message="Are you sure you want to delete"
          target={`"${confirm.username}"`}
          onConfirm={() => handleDelete(confirm)}
          onClose={() => setConfirm(null)}
        />
      )}
    </div>
  );
}
